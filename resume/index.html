<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>HTML FORMS</h1>
    <form>
    <label for="user">Username :</label><br>
    <input type="text" id="user" maxlength="8" value="HARSHINI"><br><br>
    
    <label for="pass">Password :</label><br>
    <input type="password" id="pass" name="password"><br><br>
    
    <label for="range">Range :</label><br>
    <input type="range" id="range" name="rangeselector"><br><br>
    
    <label for="email">MailID :</label><br>
    <input type="email" id="email" placeholder="mail id"><br><br>
    
    <label for="color">Color :</label><br>
    <input type="color" id="color" name="color selector"><br><br>
    
    <input type="checkbox" id="box1" name="checkbox1" value="car">
    <label for="box1">I have a Car</label><br><br>
    <input type="checkbox" id="box2" name="checkbox2" value="bike">
    <label for="box2">I have a Bike</label><br><br>
    <input type="checkbox" id="box3" name="checkbox3" value="cycle">
    <label for="box3">I have a Cycle</label><br><br>
    <input type="checkbox" id="box4" name="checkbox4" value="scooter">
    <label for="box4">I have a Scooter</label><br><br>
    
    
    <label for="tel">Tel :</label><br>
    <input type="tel" id="tel" name="Tel"><br><br>
    
    <label for="link">URL :</label><br>
    <input type="url" id="link" placeholder="url"><br><br>
    
    <label for="submit">Submit :</label><br>
    <input type="submit" id="submit" name="submit"><br><br>

    <input type="radio" id="cse" name="branch" value="CSE">
    <label for="radio">CSE</label></label><br>
    <input type="radio" id="ece" name="branch" value="ECE">
    <label for="radio">ECE</label></label><br>
    <input type="radio" id="mech" name="branch" value="MECH">
    <label for="radio">MECH</label></label><br>
    
    <label for="date">Date</label><br>
    <input type="date" id="date"><br><br>

    <label for="time">Time</label><br>
    <input type="time" id="time"><br><br>

    <label for="files">Add Files</label><br>
    <input type="file" id="files"><br><br>

    <label for="reset">Reset</label><br>
    <input type="reset" id="reset"><br><br>

    <label for="search">Search info</label><br>
    <input type="search" id="search"><br><br>

    <label for="food">Choose a food item:</label>

    <select id="food">
    <option value="icecream">Icecream</option>
    <option value="chocolate">Chocolate</option>
    <option value="pastry">Pastry</option>
    <option value="brownie">Brownie</option>
    </select>

    </form>
</body>
</html>
